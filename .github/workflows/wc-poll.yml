name: WooCommerce Order Poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll WooCommerce orders
        run: |
          curl -s -X GET "https://www.zyroocloud.com/api/woocommerce/auto-poll" \
            -H "Content-Type: application/json"
